<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sim Golf League</title>
<style>
:root{--bg:#0f1f17;--panel:#162b20;--panel2:#1d3829;--line:#2c4d3a;--text:#e9f2ec;--muted:#9db8a8;--accent:#7bd389;--accent2:#f2c14e;--bad:#e07a5f;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:5}
header .row{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0}
h1 small{color:var(--accent);font-weight:500;font-size:13px;margin-left:6px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:7px 14px;border-radius:20px;cursor:pointer;font-size:14px}
nav button.on{background:var(--accent);color:#0b1a12;border-color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:17px;margin:22px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
input,select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
input[type=number]{width:80px}
input.name{width:100%;min-width:140px}
button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#0b1a12;border-color:var(--accent);font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.pill.done{color:#0b1a12;background:var(--accent);border-color:var(--accent)}
.pill.sub{color:#2a1d00;background:var(--accent2);border-color:var(--accent2)}
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.weeks button{min-width:44px}
.weeks button.on{outline:2px solid var(--accent)}
.team h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.slot{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.slot select{max-width:170px}
.score{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap}
.big{font-size:22px;font-weight:700;color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rank1 td:first-child{color:var(--accent2);font-weight:700}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--panel2);border-radius:6px;margin-bottom:14px;font-size:14px}
@media print{header nav,.toolbar,button{display:none!important}body{background:#fff;color:#000}.card{border-color:#999;background:#fff}}
</style>
</head>
<body>
<header><div class="row"><h1 id="lg"></h1><nav id="nav"></nav></div></header>
<main id="app"></main>
<input type="file" id="importFile" accept=".json" hidden>
<script>
const KEY='simGolfLeague.v1';
// Visitors see the published league (data.json) read-only. Ben edits at this page's address + #admin,
// then publishes by replacing data.json in the repo. Edits in admin mode never change what visitors see until then.
const ADMIN=/(^|[#?&])admin\b/.test(location.hash+location.search);
const TABS=ADMIN?[['roster','Roster'],['schedule','Schedule'],['scores','Enter Scores'],['board','Leaderboard']]
               :[['board','Leaderboard'],['scores','Results'],['schedule','Schedule'],['roster','Golfers']];
const TEAM='ABCD';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return{name:'Sim Golf League',players:Array.from({length:8},(_,i)=>({id:'p'+(i+1),name:'Golfer '+(i+1),hcp:0})),subs:[],start:'',weeks:[]};}
// Fallback league data (as of Week 1, Nov 9), used only if data.json can't be loaded, e.g. when opened as a local file.
const SEED={"name":"Sim Golf League","players":[{"id":"p1","name":"Ben Ambos","hcp":15},{"id":"p2","name":"Mason McClurg","hcp":9},{"id":"p3","name":"Miles McClurg","hcp":14.5},{"id":"p4","name":"Eli Hadden","hcp":8},{"id":"p5","name":"Cole Barhorst","hcp":20},{"id":"p6","name":"Cade Beam","hcp":9.5},{"id":"p7","name":"Seth Clayton","hcp":13},{"id":"p8","name":"Cade Gingerich","hcp":17}],"subs":[{"id":"s1794265527467","name":"Owen","hcp":7}],"start":"2026-11-09","weeks":[{"n":1,"done":true,"teams":[{"slots":["p2","p1"],"fill":[null,null],"gross":46,"hcp":5.7},{"slots":["p8","p5"],"fill":["s1794265527467",null],"gross":44,"hcp":6.1},{"slots":["p7","p6"],"fill":[null,null],"gross":46,"hcp":5.45},{"slots":["p4","p3"],"fill":[null,null],"gross":42,"hcp":5.3}]},{"n":2,"done":false,"teams":[{"slots":["p2","p8"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p7","p1"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p4","p5"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p3","p6"],"fill":[null,null],"gross":null,"hcp":null}]},{"n":3,"done":false,"teams":[{"slots":["p2","p7"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p4","p8"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p3","p1"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p6","p5"],"fill":[null,null],"gross":null,"hcp":null}]},{"n":4,"done":false,"teams":[{"slots":["p2","p4"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p3","p7"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p6","p8"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p5","p1"],"fill":[null,null],"gross":null,"hcp":null}]},{"n":5,"done":false,"teams":[{"slots":["p2","p3"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p6","p4"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p5","p7"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p1","p8"],"fill":[null,null],"gross":null,"hcp":null}]},{"n":6,"done":false,"teams":[{"slots":["p2","p6"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p5","p3"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p1","p4"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p8","p7"],"fill":[null,null],"gross":null,"hcp":null}]},{"n":7,"done":false,"teams":[{"slots":["p2","p5"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p1","p6"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p8","p3"],"fill":[null,null],"gross":null,"hcp":null},{"slots":["p7","p4"],"fill":[null,null],"gross":null,"hcp":null}]}],"holes":9,"fmt":"6040","exactHcp":true};
const seed=()=>JSON.parse(JSON.stringify(SEED));
let S=seed(),PUB=null;
function prep(){
// Migration: older saves had no hole setting. Default to 9 holes and re-lock any finalized weeks with the 9-hole math. Rosters and scores are untouched.
if(S.holes==null){S.holes=9;(S.weeks||[]).forEach(w=>{if(w.done)w.teams.forEach(t=>t.hcp=null)});}
// Migration: switch to 60/40 team allowance. Finalized weeks get re-locked with the new math; rosters, schedule and gross scores are untouched.
if(S.fmt==null){S.fmt='6040';(S.weeks||[]).forEach(w=>{if(w.done)w.teams.forEach(t=>t.hcp=null)});}
// Migration: team handicaps are no longer rounded. Finalized weeks get re-locked with exact decimals; rosters, schedule and gross scores are untouched.
if(!S.exactHcp){S.exactHcp=true;(S.weeks||[]).forEach(w=>{if(w.done)w.teams.forEach(t=>t.hcp=null)});}
S.subs=S.subs||[];S.weeks=S.weeks||[];
}
let ui={tab:ADMIN?'roster':'board',week:0};
if(ADMIN)try{ui.tab=localStorage.getItem(KEY+'.tab')||'roster'}catch(e){}
function save(){if(!ADMIN)return;try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(KEY+'.tab',ui.tab)}catch(e){}}
const g=id=>S.players.find(p=>p.id===id)||S.subs.find(p=>p.id===id);
const nm=id=>g(id)?.name??'(removed)';
const hc=id=>Number(g(id)?.hcp)||0;
const actual=t=>t.slots.map((id,i)=>t.fill[i]||id);
// Handicaps are entered as 18-hole course handicaps. For 9 holes each golfer plays off half (WHS 9-hole course handicap).
// Team allowance (WHS Appendix C), rounded once at the end:
//   '6040' Greensomes / Chapman: 60% of low + 40% of high
//   '50'   Foursomes (straight alternate shot): 50% of combined
const r2=x=>Math.round(x*100)/100; // trims float noise only (e.g. 4.800000001 → 4.8)
const holeFactor=()=>S.holes===18?1:0.5;
const pHcps=t=>actual(t).map(id=>hc(id)*holeFactor());
function calcHcp(t){const h=pHcps(t),lo=Math.min(...h),hi=Math.max(...h);
  return r2(S.fmt==='50'?0.5*(lo+hi):0.6*lo+0.4*hi);}
function hcpMath(t){const h=pHcps(t),lo=Math.min(...h),hi=Math.max(...h),pre=S.holes===18?'':'9-hole: ';
  return S.fmt==='50'?`${pre}(${fmt(h[0])} + ${fmt(h[1])}) × 50% = ${fmt(calcHcp(t))}`
    :`${pre}60% × ${fmt(lo)} + 40% × ${fmt(hi)} = ${fmt(calcHcp(t))}`;}
function teamHcp(w,t){if(w.done&&t.hcp!=null)return t.hcp;return calcHcp(t);}
// Locked weeks missing a stored handicap (from migration) get one now
function lockMissing(){let mig=false;S.weeks.forEach(w=>{if(w.done)w.teams.forEach(t=>{if(t.hcp==null){t.hcp=calcHcp(t);mig=true}})});if(mig)save();}
// Show up to 2 decimals, trimming trailing zeros (4.75, 4.8, 5)
const fmt=(x,d=2)=>x==null?'—':String(Number(x.toFixed(d)));
function addDays(start,days){if(!start)return'';const[y,m,d]=start.split('-').map(Number);return new Date(y,m-1,d+days).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Round-robin (circle method): 7 weeks where every golfer partners every other golfer exactly once
function genSchedule(n,rand){
  const ids=rand?shuffle(S.players.map(p=>p.id)):S.players.map(p=>p.id);
  const fixed=ids[0],rot=ids.slice(1);
  S.weeks=[];
  for(let w=0;w<n;w++){
    const k=w%7,r=rot.slice(k).concat(rot.slice(0,k));
    const pairs=[[fixed,r[0]],[r[1],r[6]],[r[2],r[5]],[r[3],r[4]]];
    S.weeks.push({n:w+1,done:false,teams:pairs.map(p=>({slots:p,fill:[null,null],gross:null,hcp:null}))});
  }
  ui.week=0;
}

function stats(){
  const rec={};
  [...S.players.map(p=>({...p,isSub:false})),...S.subs.map(p=>({...p,isSub:true}))].forEach(p=>rec[p.id]={p,rounds:[],byWeek:{}});
  S.weeks.forEach(w=>{
    if(!w.done)return;
    w.teams.forEach(t=>{
      if(t.gross==null)return;
      const net=r2(t.gross-teamHcp(w,t));
      t.slots.forEach((id,i)=>{if(t.fill[i]&&rec[id])rec[id].byWeek[w.n]='SUB'});
      actual(t).forEach(id=>{if(!rec[id])return;rec[id].rounds.push({w:w.n,gross:t.gross,net});rec[id].byWeek[w.n]=net});
    });
  });
  return Object.values(rec).map(r=>{
    const n=r.rounds.length,tg=r.rounds.reduce((a,x)=>a+x.gross,0),tn=r.rounds.reduce((a,x)=>a+x.net,0);
    return{...r,n,tg,tn,ag:n?tg/n:null,an:n?tn/n:null,best:n?Math.min(...r.rounds.map(x=>x.net)):null};
  });
}
function ranked(list){
  list.sort((a,b)=>(a.an??1e9)-(b.an??1e9)||b.n-a.n);
  let last=null,rank=0;
  list.forEach((r,i)=>{if(r.an==null){r.rank='—';return}if(r.an!==last){rank=i+1;last=r.an}r.rank=rank});
  return list;
}

/* ---------- render ---------- */
function render(){
  document.getElementById('lg').innerHTML=esc(S.name)+`<small>${S.holes===18?18:9}-hole 2-man alternate shot</small>`;
  document.title=S.name;
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const app=document.getElementById('app');
  app.innerHTML=(ADMIN?adminBar():'')+{roster,schedule,scores,board}[ui.tab]();
}
function adminBar(){
  const dirty=PUB&&JSON.stringify(PUB)!==JSON.stringify(S);
  return `<div class="card toolbar" style="border-color:var(--accent2)"><span class="pill sub">Admin</span>
  <span class="small">${dirty?'You have changes visitors can\'t see yet.':'Matches the published site.'}</span><span style="flex:1"></span>
  <button class="btn primary" onclick="publishData()">Download data.json to publish</button>
  <button class="btn" onclick="loadPublished()">Load published data</button></div>`;
}
function publishData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='data.json';a.click()}
function loadPublished(){if(!PUB){alert('Could not load data.json from the site.');return}
  if(!confirm('Replace the data in this browser with what visitors currently see?'))return;
  S=JSON.parse(JSON.stringify(PUB));prep();lockMissing();save();render()}
function go(t){ui.tab=t;save();render();window.scrollTo(0,0)}

function roster(){
  if(!ADMIN){const row=p=>`<tr><td>${esc(p.name)}</td><td class="num">${fmt(p.hcp)}</td><td class="num">${fmt(r2(p.hcp*holeFactor()))}</td></tr>`;
    const head=`<tr><th>Golfer</th><th class="num">18-hole HCP</th><th class="num">${S.holes===18?'Playing':'9-hole'} HCP</th></tr>`;
    return `<h2>Golfers</h2><div class="card scroll"><table>${head}${S.players.map(row).join('')}</table></div>
    ${S.subs.length?`<h2>Subs</h2><div class="card scroll"><table>${head}${S.subs.map(row).join('')}</table></div>`:''}
    <div class="note">Team handicap: ${S.fmt==='50'?'50% of the partners\' combined handicaps':'60% of the lower handicap + 40% of the higher'}, using ${S.holes===18?'18-hole':'9-hole (half of 18-hole)'} handicaps. Net = team gross − team handicap, no rounding.</div>`;}
  return `<h2>League</h2>
  <div class="card toolbar"><label>League name <input class="name" style="width:260px" value="${esc(S.name)}" onchange="S.name=this.value;save();render()"></label>
  <label>Holes per match <select onchange="S.holes=+this.value;save();render()"><option value="9" ${S.holes!==18?'selected':''}>9</option><option value="18" ${S.holes===18?'selected':''}>18</option></select></label>
  <label>Team handicap <select onchange="S.fmt=this.value;save();render()"><option value="6040" ${S.fmt!=='50'?'selected':''}>60% low + 40% high (Greensomes / Chapman)</option><option value="50" ${S.fmt==='50'?'selected':''}>50% of combined (straight alternate shot)</option></select></label>
  <span class="muted small">Changing either setting affects open weeks only. Finalized weeks keep the handicaps they were locked with. Reopen and re-finalize a week to recalculate it.</span></div>
  <h2>League golfers (8 spots)</h2>
  <div class="card scroll"><table><tr><th>#</th><th>Name</th><th class="num">Handicap</th></tr>
  ${S.players.map((p,i)=>`<tr><td>${i+1}</td><td><input class="name" value="${esc(p.name)}" onchange="setP('players',${i},'name',this.value)"></td>
  <td class="num"><input type="number" step="0.1" value="${p.hcp}" onchange="setP('players',${i},'hcp',this.value)"></td></tr>`).join('')}
  </table><p class="muted small">Enter each golfer's normal 18-hole course handicap. For 9-hole matches the app halves it automatically, then applies the team allowance chosen above. Handicaps lock into a week when that week is finalized, so mid-season changes don't rewrite past results.</p></div>
  <h2>Sub golfers</h2>
  <div class="card scroll"><table><tr><th>Name</th><th class="num">Handicap</th><th></th></tr>
  ${S.subs.length?S.subs.map((p,i)=>`<tr><td><input class="name" value="${esc(p.name)}" onchange="setP('subs',${i},'name',this.value)"></td>
  <td class="num"><input type="number" step="0.1" value="${p.hcp}" onchange="setP('subs',${i},'hcp',this.value)"></td>
  <td class="num"><button class="btn danger" onclick="delSub(${i})">Remove</button></td></tr>`).join(''):`<tr><td colspan="3" class="muted">No subs yet.</td></tr>`}
  </table><div class="toolbar" style="margin-top:10px"><button class="btn primary" onclick="addSub()">+ Add sub</button></div></div>
  <h2>Data</h2>
  <div class="card toolbar"><button class="btn" onclick="exportData()">Download backup (.json)</button>
  <button class="btn" onclick="document.getElementById('importFile').click()">Restore from backup</button>
  <button class="btn danger" onclick="resetAll()">Reset everything</button>
  <span class="muted small">Data lives in this browser only — download a backup now and then.</span></div>`;
}
function setP(list,i,k,v){S[list][i][k]=k==='hcp'?(parseFloat(v)||0):v;save();render()}
function addSub(){S.subs.push({id:'s'+Date.now(),name:'Sub '+(S.subs.length+1),hcp:0});save();render()}
function delSub(i){const id=S.subs[i].id;if(S.weeks.some(w=>w.teams.some(t=>t.fill.includes(id)))){alert('This sub is used in a week. Swap them out of that week first.');return}S.subs.splice(i,1);save();render()}
function exportData(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=S.name.replace(/\W+/g,'-')+'-backup.json';a.click()}
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.players)||d.players.length!==8)throw 0;S=d;S.subs=S.subs||[];S.weeks=S.weeks||[];save();render();alert('Backup restored.')}catch(x){alert('That file is not a valid league backup.')}};r.readAsText(f);e.target.value=''};
function resetAll(){if(confirm('Erase all golfers, schedule and scores?')){S=fresh();save();render()}}

function schedule(){
  const has=S.weeks.length;
  return `<h2>Schedule</h2>
  ${!ADMIN?'':`<div class="card toolbar">
    <label>First week <input type="date" value="${S.start}" onchange="S.start=this.value;save();render()"></label>
    <label>Weeks <input type="number" id="nw" min="1" max="28" value="${has||7}"></label>
    <label><input type="checkbox" id="rnd" checked> Randomize pairings</label>
    <button class="btn primary" onclick="makeSched()">${has?'Rebuild schedule':'Build schedule'}</button>
    ${has?'<button class="btn" onclick="window.print()">Print</button>':''}
  </div>`}
  <div class="note">One match per week: all 4 two-man teams play alternate shot. With 8 golfers, 7 weeks gives every golfer a different partner each week — everyone partners everyone exactly once. Seasons longer than 7 weeks repeat the rotation.</div>
  ${has?`<div class="grid">${S.weeks.map((w,wi)=>`<div class="card">
    <h3 style="margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between">Week ${w.n} <span class="muted small">${addDays(S.start,7*wi)} ${w.done?'<span class="pill done">Final</span>':''}</span></h3>
    ${w.teams.map((t,ti)=>`<div class="slot"><span><b>Team ${TEAM[ti]}</b> · ${actual(t).map((id,i)=>esc(nm(id))+(t.fill[i]?' <span class="pill sub">sub</span>':'')).join(' &amp; ')}</span><span class="muted small">HCP ${fmt(teamHcp(w,t))}</span></div>`).join('')}
  </div>`).join('')}</div>`:'<p class="muted">Set up your 8 golfers on the Roster tab, then build the schedule.</p>'}`;
}
function makeSched(){
  const n=Math.max(1,Math.min(28,parseInt(document.getElementById('nw').value)||7));
  if(S.weeks.some(w=>w.done||w.teams.some(t=>t.gross!=null))&&!confirm('Rebuilding wipes all entered scores. Continue?'))return;
  genSchedule(n,document.getElementById('rnd').checked);save();render();
}

function scores(){
  if(!S.weeks.length)return '<p class="muted">Build the schedule first.</p>';
  ui.week=Math.min(ui.week,S.weeks.length-1);
  const wi=ui.week,w=S.weeks[wi];
  const used=new Set(w.teams.flatMap(t=>t.fill.filter(Boolean)));
  const allIn=w.teams.every(t=>t.gross!=null);
  const res=allIn?w.teams.map((t,ti)=>({ti,t,h:teamHcp(w,t),net:r2(t.gross-teamHcp(w,t))})).sort((a,b)=>a.net-b.net):[];
  if(!ADMIN)return resultsView(wi,w,allIn,res);
  return `<h2>Enter scores</h2>
  <div class="weeks">${S.weeks.map((x,i)=>`<button class="btn ${i===wi?'on':''} ${x.done?'primary':''}" onclick="ui.week=${i};render()">W${x.n}</button>`).join('')}</div>
  <div class="card toolbar"><b>Week ${w.n}</b><span class="muted">${addDays(S.start,7*wi)}</span>${w.done?'<span class="pill done">Final</span>':'<span class="pill">Open</span>'}
    <span style="flex:1"></span>
    ${w.done?`<button class="btn" onclick="reopen(${wi})">Reopen to edit</button>`:`<button class="btn primary" onclick="finalize(${wi})">Finalize week</button>`}</div>
  <div class="grid">${w.teams.map((t,ti)=>{const h=teamHcp(w,t);return `<div class="card team">
    <h3>Team ${TEAM[ti]} <span class="pill">Team HCP ${fmt(h)}</span></h3>
    ${t.slots.map((id,si)=>`<div class="slot"><span>${esc(nm(id))}<br><span class="muted small">scheduled</span></span>
      <span><select ${w.done?'disabled':''} onchange="setFill(${wi},${ti},${si},this.value)">
        <option value="">${esc(nm(id))} (${hc(id)})</option>
        ${S.subs.filter(s=>!used.has(s.id)||t.fill[si]===s.id).map(s=>`<option value="${s.id}" ${t.fill[si]===s.id?'selected':''}>SUB: ${esc(s.name)} (${s.hcp})</option>`).join('')}
      </select></span></div>`).join('')}
    <p class="muted small" style="margin:6px 0 0">${hcpMath(t)}</p>
    <div class="score"><label>Gross <input type="number" ${w.done?'disabled':''} value="${t.gross??''}" onchange="setGross(${wi},${ti},this.value)"></label>
    <span>Net <span class="big">${t.gross!=null?fmt(t.gross-h):'—'}</span></span></div>
  </div>`}).join('')}</div>
  ${allIn?`<h2>Week ${w.n} results</h2><div class="card scroll"><table><tr><th>Place</th><th>Team</th><th>Golfers</th><th class="num">Gross</th><th class="num">HCP</th><th class="num">Net</th></tr>
  ${res.map((r,i)=>`<tr class="${i===0||r.net===res[0].net?'rank1':''}"><td>${res.findIndex(x=>x.net===r.net)+1}</td><td>${TEAM[r.ti]}</td><td>${actual(r.t).map(id=>esc(nm(id))).join(' &amp; ')}</td><td class="num">${r.t.gross}</td><td class="num">${fmt(r.h)}</td><td class="num"><b>${fmt(r.net)}</b></td></tr>`).join('')}</table></div>`:''}`;
}
function resultsTable(w,res){return `<div class="card scroll"><table><tr><th>Place</th><th>Team</th><th>Golfers</th><th class="num">Gross</th><th class="num">HCP</th><th class="num">Net</th></tr>
  ${res.map((r,i)=>`<tr class="${r.net===res[0].net?'rank1':''}"><td>${res.findIndex(x=>x.net===r.net)+1}</td><td>${TEAM[r.ti]}</td><td>${actual(r.t).map(id=>esc(nm(id))).join(' &amp; ')}</td><td class="num">${r.t.gross}</td><td class="num">${fmt(r.h)}</td><td class="num"><b>${fmt(r.net)}</b></td></tr>`).join('')}</table></div>`}
function resultsView(wi,w,allIn,res){
  return `<h2>Results</h2>
  <div class="weeks">${S.weeks.map((x,i)=>`<button class="btn ${i===wi?'on':''} ${x.done?'primary':''}" onclick="ui.week=${i};render()">W${x.n}</button>`).join('')}</div>
  <div class="card toolbar"><b>Week ${w.n}</b><span class="muted">${addDays(S.start,7*wi)}</span>${w.done?'<span class="pill done">Final</span>':'<span class="pill">Upcoming</span>'}</div>
  ${w.done&&allIn?resultsTable(w,res):''}
  <div class="grid">${w.teams.map((t,ti)=>{const h=teamHcp(w,t);return `<div class="card team">
    <h3>Team ${TEAM[ti]} <span class="pill">Team HCP ${fmt(h)}</span></h3>
    ${t.slots.map((id,si)=>`<div class="slot"><span>${esc(nm(t.fill[si]||id))}${t.fill[si]?` <span class="pill sub">sub for ${esc(nm(id))}</span>`:''}</span><span class="muted small">HCP ${fmt(hc(t.fill[si]||id))}</span></div>`).join('')}
    <p class="muted small" style="margin:6px 0 0">${hcpMath(t)}</p>
    ${w.done&&t.gross!=null?`<div class="score"><span>Gross <b>${t.gross}</b></span><span>Net <span class="big">${fmt(t.gross-h)}</span></span></div>`:''}
  </div>`}).join('')}</div>`;
}
function setFill(wi,ti,si,v){S.weeks[wi].teams[ti].fill[si]=v||null;save();render()}
function setGross(wi,ti,v){const n=parseInt(v);S.weeks[wi].teams[ti].gross=isNaN(n)?null:n;save();render()}
function finalize(wi){const w=S.weeks[wi];if(!w.teams.every(t=>t.gross!=null)){alert('Enter a gross score for all 4 teams first.');return}
  w.teams.forEach(t=>t.hcp=calcHcp(t));w.done=true;
  if(wi<S.weeks.length-1)ui.week=wi+1;save();render()}
function reopen(wi){const w=S.weeks[wi];w.done=false;w.teams.forEach(t=>t.hcp=null);ui.week=wi;save();render()}

function board(){
  const st=stats(),reg=ranked(st.filter(r=>!r.p.isSub)),subs=ranked(st.filter(r=>r.p.isSub&&r.n));
  const done=S.weeks.filter(w=>w.done);
  const tbl=list=>`<div class="card scroll"><table><tr><th>Rank</th><th>Golfer</th><th class="num">HCP</th><th class="num">Rounds</th><th class="num">Total Gross</th><th class="num">Avg Gross</th><th class="num">Total Net</th><th class="num">Avg Net</th><th class="num">Best Net</th></tr>
  ${list.map(r=>`<tr class="${r.rank===1?'rank1':''}"><td>${r.rank}</td><td>${esc(r.p.name)}</td><td class="num">${r.p.hcp}</td><td class="num">${r.n}</td><td class="num">${r.n?r.tg:'—'}</td><td class="num">${fmt(r.ag)}</td><td class="num">${r.n?fmt(r.tn):'—'}</td><td class="num"><b>${fmt(r.an)}</b></td><td class="num">${fmt(r.best)}</td></tr>`).join('')}</table></div>`;
  return `<h2>Player leaderboard</h2>
  <div class="note">Ranked by <b>average net</b> (lowest wins), so a golfer who missed a week isn't hurt or helped by the totals. Each golfer is credited with their team's score for the weeks they played. ${done.length} of ${S.weeks.length||0} weeks final.</div>
  ${tbl(reg)}
  ${subs.length?`<h2>Subs</h2>${tbl(subs)}`:''}
  ${done.length?`<h2>Week by week (net)</h2><div class="card scroll"><table><tr><th>Golfer</th>${done.map(w=>`<th class="num">W${w.n}</th>`).join('')}</tr>
  ${reg.map(r=>`<tr><td>${esc(r.p.name)}</td>${done.map(w=>{const v=r.byWeek[w.n];return `<td class="num">${v==='SUB'?'<span class="pill sub">out</span>':fmt(v)}</td>`}).join('')}</tr>`).join('')}</table></div>`:''}`;
}
async function boot(){
  try{const r=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(r.ok)PUB=await r.json()}catch(e){}
  if(PUB)S=JSON.parse(JSON.stringify(PUB));
  if(ADMIN){try{const d=JSON.parse(localStorage.getItem(KEY));if(d)S=d}catch(e){}}
  prep();lockMissing();
  const last=S.weeks.map(w=>w.done).lastIndexOf(true);
  ui.week=ADMIN?Math.min(last+1,Math.max(S.weeks.length-1,0)):Math.max(last,0);
  render();
}
boot();
</script>
</body>
</html>
